<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Word Counter - ARSA TOOLS</title><link rel="stylesheet" href="../style.css"></head><body><header class="topbar"><div class="container nav"><a class="logo" href="../index.html">ARSA<span>TOOLS</span></a></div></header><main class="container page"><a class="back" href="../index.html">← Kembali</a><div class="tool-panel"><h1>📝 Word Counter</h1><textarea id="text" rows="12" placeholder="Tulis atau tempel teks di sini..." oninput="count()"></textarea><div class="result" id="result">0 kata · 0 karakter</div></div></main></body><script>function count(){let t=document.getElementById('text').value;let w=t.trim()?t.trim().split(/\s+/).length:0;document.getElementById('result').textContent=w+' kata · '+t.length+' karakter'}</script></html>
