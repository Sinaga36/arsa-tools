<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Password Generator - ARSA TOOLS</title><link rel="stylesheet" href="../style.css"></head><body><header class="topbar"><div class="container nav"><a class="logo" href="../index.html">ARSA<span>TOOLS</span></a></div></header><main class="container page"><a class="back" href="../index.html">← Kembali</a><div class="tool-panel"><h1>🔐 Password Generator</h1><label>Panjang password</label><input class="input" id="len" type="number" min="6" max="64" value="16"><button class="btn" onclick="generate()">Generate</button><div class="result" id="result">Klik Generate untuk membuat password.</div></div></main><script>function generate(){let n=Math.min(64,Math.max(6,+document.getElementById('len').value||16));let c='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%';let s='';for(let i=0;i<n;i++)s+=c[Math.floor(Math.random()*c.length)];document.getElementById('result').textContent=s}</script></body></html>
